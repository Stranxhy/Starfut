services:
  db:
    image: postgres:16-alpine
    container_name: starfutbol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starfutbol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starfutbol_dev}
      POSTGRES_DB: ${POSTGRES_DB:-starfutbol}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - starfutbol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starfutbol}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  starfutbol_pgdata:
